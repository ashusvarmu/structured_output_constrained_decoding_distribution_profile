[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ashusvarmu-structured_output_constrained_decoding_distribution_profile"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别AIGC 内容生成工程师·结构化输出的约束解码上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ashusvarmu" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ashusvarmu.github.io"
Repository = "https://github.com/ashusvarmu/structured_output_constrained_decoding_distribution_profile"
Issues = "https://github.com/ashusvarmu/structured_output_constrained_decoding_distribution_profile/issues"

[project.scripts]
structured_output_constrained_decoding_distribution_profile = "structured_output_constrained_decoding_distribution_profile:main"

[tool.setuptools]
py-modules = ["structured_output_constrained_decoding_distribution_profile"]
